<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Đập Chuột</title>
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game" id="game" data-state="registering">

    <section class="screen screen-register" id="screenRegister">
      <div class="panel">
        <h1 class="title">Đăng ký để chơi</h1>
        <p class="tagline">Chỉ cần nhập một lần trên trình duyệt này.</p>
        <form id="registerForm" novalidate>
          <label class="field">
            <span class="field-label">Họ tên</span>
            <input type="text" name="fullName" id="fullNameInput" autocomplete="name" required>
            <span class="field-error" id="fullNameError"></span>
          </label>
          <label class="field">
            <span class="field-label">Email</span>
            <input type="email" name="email" id="emailInput" autocomplete="email" required>
            <span class="field-error" id="emailError"></span>
          </label>
          <label class="field">
            <span class="field-label">Số điện thoại</span>
            <input type="tel" name="phone" id="phoneInput" autocomplete="tel" required>
            <span class="field-error" id="phoneError"></span>
          </label>
          <p class="field-error" id="registerFormError" role="alert"></p>
          <button class="btn btn-primary btn-lg" type="submit" id="btnRegister">Tiếp tục</button>
        </form>
      </div>
    </section>

    <section class="screen screen-start" id="screenStart">
      <div class="panel">
        <h1 class="title">🐭 Đập Chuột</h1>
        <p class="tagline">Bấm vào chuột càng nhiều càng tốt trong 30 giây.</p>
        <p class="high-score" id="startHighScore"></p>
        <button class="btn btn-primary btn-lg" id="btnStart" type="button">Bắt đầu</button>
      </div>
    </section>

    <section class="screen screen-play" id="screenPlay">
      <div class="hud">
        <span class="hud-score">Điểm: <strong id="scoreValue">0</strong></span>
        <span class="hud-time" id="timeValue">30s</span>
      </div>
      <div class="grid" id="grid" role="group" aria-label="Lưới 9 ô, bấm vào ô có chuột để ghi điểm"></div>
    </section>

    <section class="screen screen-end" id="screenEnd">
      <div class="panel">
        <h1 class="title">Hết giờ!</h1>
        <p class="end-score" id="endScore">0 điểm</p>
        <p class="end-high" id="endHighScore">Điểm cao nhất: 0</p>
        <p class="end-record" id="endRecord" hidden>🏆 Kỷ lục mới!</p>
        <button class="btn btn-primary btn-lg" id="btnRestart" type="button">Chơi lại</button>
      </div>
    </section>

  </main>
  <script src="game.js"></script>
</body>
</html>
